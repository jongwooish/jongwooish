name: Update repository list

on:
  schedule:
    - cron: "17 15 * * *"   # every day at 00:17 KST
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/repo-descriptions.json"
      - "scripts/update_repos.py"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild repository tables
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_repos.py
      - name: Commit if changed
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "Jongwoo Yun"
          git config user.email "87044659+jongwooish@users.noreply.github.com"
          git add README.md README/
          git commit -m "Update repository list"
          git push
